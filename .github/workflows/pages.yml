# Slomp's published site on GitHub Pages: https://homiejhan.github.io/slomp/
#
# GitHub Pages serves files only, so this job reads the sources on a schedule and writes the data files the page
# searches in the browser (backend/slomp/site.py; design in docs/DESIGN-static-site.md). The response cache travels
# from run to run, so no source is read more often than Slomp's server would read it.
name: Publish the site

on:
  schedule:
    - cron: "23 5,11,17,23 * * *"     # every 6 hours; 05:23 UTC is just after midnight in Texas
  workflow_dispatch:
    inputs:
      assistant:
        description: "Started by an AI assistant: skip sites whose robots.txt turns AI assistants away by name"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: America/Chicago               # dates and times read as Slomp reads them in Texas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Slomp
        run: pip install -e ./backend
      - name: Restore the response cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slomp
          key: slomp-cache-${{ github.run_id }}
          restore-keys: slomp-cache-
      - name: Read the sources and write the site
        run: slomp site build --out site --prune-cache
        env:
          SLOMP_ASSISTANT: ${{ inputs.assistant && '1' || '' }}
      - name: Save the response cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slomp
          key: slomp-cache-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
