[project]
name = "plum"
version = "0.1.0"
description = "Plum — product matching, coupon scoring and landed-cost ranking engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
probe = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
