[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plum"
version = "0.2.0"
description = "Plum: local weekly-ad deals by city, plus a product matching, coupon scoring and landed-cost engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
probe = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
plum = "plum.cli:main"

[tool.setuptools.packages.find]
include = ["plum*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
