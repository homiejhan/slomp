[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plum"
version = "1.0.0"
description = "Deals near any Texas city in the next 7 days, and the biggest verified online discounts, by industry"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plum = "plum.cli:main"

[tool.setuptools.packages.find]
include = ["plum*"]

[tool.setuptools.package-data]
plum = ["data/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
